name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Test Windows app
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
      - name: Build Windows files
        shell: pwsh
        run: .\release.ps1
      - name: Publish files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ($env:GITHUB_REF_NAME).Substring(1)
          $notes = "packaging/RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing $notes" }
          $files = @(
            "release/YangiLotin-v$version.exe",
            "release/YangiLotin-portable-x64-v$version.zip",
            "release/YangiLotin-source-v$version.zip",
            "release/SHA256SUMS.txt"
          )
          gh release create $env:GITHUB_REF_NAME @files --verify-tag `
            --title "Yangi Lotin v$version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release failed" }
