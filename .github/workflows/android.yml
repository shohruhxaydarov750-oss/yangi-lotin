name: Android keyboard checks

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test rules and build APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: YangiLotin-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tap through the keyboard in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          script: python3 mobile/android/scripts/smoke_ime.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: YangiLotin-Android-emulator-failure
          path: mobile/android/keyboard-smoke.png
          if-no-files-found: ignore
